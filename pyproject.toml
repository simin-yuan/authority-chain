[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-chain"
version = "0.1.0"
description = "Append-only, hash-chained ledger that gates who may change an agent's rules, against which revision."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Simin Yuan"}]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
ORCID = "https://orcid.org/0009-0002-6843-3390"
Homepage = "https://github.com/simin-yuan/authority-chain"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
authority-chain = "authority_chain.cli:main"

[tool.setuptools]
packages = ["authority_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
